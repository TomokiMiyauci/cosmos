# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2025-11-23
openapi: 3.1.1
info:
  title: Content management system API
  version: 0.1.0

paths:
  /entries:
    get:
      summary: Get entry summaries
      operationId: getSummaries
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntrySummary"
    post:
      operationId: postEntry
      requestBody:
        description: OK
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identitiy"

  /entries/{id}:
    get:
      summary: Returns single entry
      operationId: getEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    put:
      summary: Replace entry
      operationId: putEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: OK
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "204":
          description: OK

    delete:
      summary: Delete entry
      operationId: deleteEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: OK
  /resources:
    get:
      summary: Retruns resources
      operationId: getResources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/{id}:
    get:
      summary: Return resource
      operationId: getResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

        "404":
          description: Not found
  /models:
    get:
      summary: Return models
      operationId: getModels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

  /models/{id}:
    get:
      summary: Return model
      operationId: getModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Error

components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type.

        title:
          type: string
          description: Short human-readable summary of the problem type.

        status:
          type: int
          description: HTTP status code generated by the origin server for this occurrence of the problem.

        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.

        instance:
          type: string
          description: URI reference that identifies the specific occurrence of the problem.

      required:
        - type
        - title
        - status
        - detail
        - instance

    EntryInput:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        contents:
          $ref: "#/components/schemas/Contents"
      required:
        - name
        - model
        - contents

    EntrySummary:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        name:
          type: string
      required:
        - id
        - model
        - name
      unevaluatedProperties: false

    Identitiy:
      type: object
      properties:
        id:
          type: string
      required:
        - id
      additionalProperties: false

    Resource:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        type:
          enum:
            - collection
            - singleton
        description:
          type: string
      required:
        - id
        - model
        - type
        - description
      additionalProperties: false

    Model:
      oneOf:
        - $ref: "#/components/schemas/StringModel"
        - $ref: "#/components/schemas/NumberModel"
        - $ref: "#/components/schemas/BooleanModel"
        - $ref: "#/components/schemas/DatetimeModel"
        - $ref: "#/components/schemas/ReferenceModel"
        - $ref: "#/components/schemas/MapModel"
        - $ref: "#/components/schemas/ListModel"
        - $ref: "#/components/schemas/UnionModel"

    StringModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["string"]
      required:
        - type

    NumberModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["number"]
      required:
        - type

    BooleanModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["boolean"]
      required:
        - type

    DatetimeModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["datetime"]
      required:
        - type

    ReferenceModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["reference"]

        model:
          type: string
      required:
        - type
        - model

    MapModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["map"]

        props:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Model"
        required:
          type: array
          items:
            type: string
      required:
        - type
        - props
        - required

    ListModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["list"]

        item:
          $ref: "#/components/schemas/Model"
      required:
        - type
        - item

    UnionModel:
      type: object
      allOf:
        - $ref: "#/components/schemas/BaseModel"
      properties:
        type:
          enum: ["union"]

        variants:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Model"
      required:
        - type
        - variants

    BaseModel:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
      required:
        # - id
        - title
        - description
      unevaluatedProperties: false

    Entry:
      type: object
      allOf:
        - $ref: "#/components/schemas/EntrySummary"
      properties:
        contents:
          $ref: "#/components/schemas/Contents"
      required:
        - contents
      unevaluatedProperties: false

    Contents:
      oneOf:
        - $ref: "#/components/schemas/StringContents"
        - $ref: "#/components/schemas/NumberContents"
        - $ref: "#/components/schemas/BooleanContents"
        - $ref: "#/components/schemas/DatetimeContents"
        - $ref: "#/components/schemas/MapContents"
        - $ref: "#/components/schemas/ListContents"
        - $ref: "#/components/schemas/UnionContents"
        - $ref: "#/components/schemas/ReferenceContents"

    StringContents:
      type: string
    NumberContents:
      type: number
    BooleanContents:
      type: boolean
    DatetimeContents:
      type: string
    MapContents:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Contents"
    ListContents:
      type: array
      items:
        $ref: "#/components/schemas/Contents"
    UnionContents:
      type: array
      prefixItems:
        - type: string
        - $ref: "#/components/schemas/Contents"
      unevaluatedItems: false
    ReferenceContents:
      type: string
